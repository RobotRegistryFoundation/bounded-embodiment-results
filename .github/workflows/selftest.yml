# Runs the tools' own tests when a pull request changes tools/ (or a workflow,
# which the tests also check). Read-only token, no secrets.
name: selftest

on:
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/**"

# Read-only: the tests only read the checkout.
permissions:
  contents: read

concurrency:
  group: selftest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest (the tools themselves use only the standard library)
        run: python -m pip install --disable-pip-version-check "pytest>=8" "pyyaml>=6"
      - name: Run tools/tests
        run: python -m pytest -q tools/tests
