# Builds the results table from main and publishes it with GitHub Pages.
# Nothing is committed: the site is uploaded as a Pages artifact, so this never
# competes with branch protection. Settings > Pages > Source must be
# "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job below gets more.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the table
        run: python3 tools/build_table.py --repo . --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # deploy-pages needs exactly these two; this job runs only for main.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
